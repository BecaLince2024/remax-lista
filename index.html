<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Dueños RE/MAX</title>
<style>
:root{
  --bg:#f6f7f9;--surface:#ffffff;--surface-2:#f0f2f5;--text:#16181d;--muted:#5d6472;--line:#e2e5ea;
  --brand:#d6202f;--brand-ink:#ffffff;--blue:#1f4fb0;--ok:#16794a;--ok-bg:#e6f4ec;--warn:#9a5b00;--warn-bg:#fff3dc;
  --chip:#eef1f5;--chip-on:#16181d;--chip-on-ink:#ffffff;--shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1115;--surface:#171a20;--surface-2:#1f232b;--text:#eceef2;--muted:#9aa3b2;--line:#2a2f39;
  --brand:#ff4b57;--brand-ink:#ffffff;--blue:#7aa7ff;--ok:#5fd39a;--ok-bg:#12301f;--warn:#f3b44c;--warn-bg:#33270f;
  --chip:#232833;--chip-on:#eceef2;--chip-on-ink:#0f1115;--shadow:none;color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0f1115;--surface:#171a20;--surface-2:#1f232b;--text:#eceef2;--muted:#9aa3b2;--line:#2a2f39;
  --brand:#ff4b57;--brand-ink:#ffffff;--blue:#7aa7ff;--ok:#5fd39a;--ok-bg:#12301f;--warn:#f3b44c;--warn-bg:#33270f;
  --chip:#232833;--chip-on:#eceef2;--chip-on-ink:#0f1115;--shadow:none;color-scheme:dark;}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
.wrap{max-width:860px;margin:0 auto;padding:16px}
.hidden{display:none!important}
button,input,select{font:inherit;color:inherit}
/* Candado */
.lock{min-height:100vh;display:grid;place-items:center;padding:16px}
.lock-card{width:100%;max-width:360px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:24px;box-shadow:var(--shadow)}
.logo{display:inline-block;background:var(--brand);color:var(--brand-ink);font-weight:800;letter-spacing:.5px;padding:4px 10px;border-radius:8px;font-size:13px}
.lock h1{font-size:20px;margin:14px 0 4px}
.lock p{color:var(--muted);margin:0 0 16px}
.field{width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2)}
.field:focus{outline:2px solid var(--blue);outline-offset:1px}
.check{display:flex;gap:8px;align-items:center;margin:12px 0;color:var(--muted);font-size:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:10px;padding:11px 14px;font-weight:600;cursor:pointer;text-decoration:none}
.btn-primary{background:var(--brand);color:var(--brand-ink);width:100%}
.err{color:var(--brand);font-size:14px;min-height:20px;margin-top:8px}
/* Cabecera */
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
header h1{font-size:20px;margin:6px 0 0}
.sub{color:var(--muted);font-size:13px}
.icon-btn{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;cursor:pointer}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stat b{display:block;font-size:20px}
.stat span{color:var(--muted);font-size:12px}
.tools{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0 10px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.search{flex:1 1 220px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:0;background:var(--chip);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--chip-on);color:var(--chip-on-ink)}
/* Tarjetas */
.list{display:grid;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow)}
.card-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.place{font-weight:700}
.km{color:var(--muted);font-weight:500}
.title{margin:6px 0 8px;overflow-wrap:anywhere}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.tag{font-size:12px;border-radius:6px;padding:2px 8px;background:var(--surface-2);color:var(--muted)}
.tag.ok{background:var(--ok-bg);color:var(--ok)}
.tag.warn{background:var(--warn-bg);color:var(--warn)}
.conf{font-size:12px;color:var(--muted);text-align:right;min-width:64px}
.bar{height:6px;background:var(--surface-2);border-radius:99px;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--ok)}
details{border-top:1px solid var(--line);margin-top:8px;padding-top:8px}
summary{cursor:pointer;color:var(--blue);font-size:14px}
.why{font-size:14px;margin:8px 0 0}
.why b{display:block;font-size:12px;color:var(--muted);font-weight:600;margin-top:8px}
.full{font-size:13px;color:var(--muted);margin-top:8px;overflow-wrap:anywhere}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.act{flex:1 1 auto;background:var(--surface-2);color:var(--text);border:1px solid var(--line)}
.act.call{background:var(--brand);color:var(--brand-ink);border-color:transparent}
.status{margin-left:auto}
.status select{padding:8px;border-radius:10px;border:1px solid var(--line);background:var(--surface)}
.card[data-status="interesado"]{border-color:var(--ok)}
.card[data-status="descartado"]{opacity:.55}
.empty{color:var(--muted);text-align:center;padding:40px 0}
footer{color:var(--muted);font-size:12px;text-align:center;margin:24px 0 8px}
@media (max-width:480px){.stats{grid-template-columns:repeat(3,1fr)}.stat b{font-size:18px}.act{flex:1 1 30%}}
</style>
</head>
<body>
<section id="lock" class="lock">
  <form class="lock-card" id="lockForm" autocomplete="off">
    <span class="logo">RE/MAX</span>
    <h1>Dueños para llamar</h1>
    <p>Lista privada. Escribe la contraseña para abrirla.</p>
    <input class="field" id="pw" type="password" placeholder="Contraseña" autocomplete="current-password" required>
    <label class="check"><input type="checkbox" id="remember"> Recordar en este celular</label>
    <button class="btn btn-primary" type="submit" id="openBtn">Abrir</button>
    <div class="err" id="err" role="alert"></div>
  </form>
</section>

<main id="app" class="wrap hidden">
  <header>
    <div>
      <span class="logo">RE/MAX</span>
      <h1>Dueños para llamar</h1>
      <div class="sub" id="updated"></div>
    </div>
    <button class="icon-btn" id="logout" title="Cerrar (olvidar contraseña en este celular)">Cerrar</button>
  </header>
  <div class="stats">
    <div class="stat"><b id="sTotal">0</b><span>dueños</span></div>
    <div class="stat"><b id="sNear">0</b><span>a menos de 5 km</span></div>
    <div class="stat"><b id="sPhone">0</b><span>con teléfono</span></div>
  </div>
  <div class="tools">
    <div class="row">
      <input class="field search" id="q" type="search" placeholder="Buscar: distrito, calle, precio…">
      <select class="field" id="sort" style="flex:0 0 auto;width:auto">
        <option value="km">Más cerca</option>
        <option value="conf">Más seguro</option>
        <option value="new">Más reciente</option>
      </select>
    </div>
    <div class="chips" id="chips"></div>
  </div>
  <div class="list" id="list"></div>
  <footer>Datos de anuncios públicos de Facebook, revisados uno por uno. Uso interno: no compartir.</footer>
</main>

const STORE = "remax-dueños";
const $ = (id) => document.getElementById(id);
let DATA = null;
const state = { q: "", district: "Todos", only: "", sort: "km" };

function safeGet(key) { try { return localStorage.getItem(key); } catch { return null; } }
function safeSet(key, value) { try { localStorage.setItem(key, value); } catch {} }
function safeDel(key) { try { localStorage.removeItem(key); } catch {} }
const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));

async function decrypt(password) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey(
    { name: "PBKDF2", salt: b64(PAYLOAD.salt), iterations: PAYLOAD.iterations, hash: "SHA-256" },
    base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(PAYLOAD.iv) }, key, b64(PAYLOAD.data));
  return JSON.parse(new TextDecoder().decode(plain));
}

async function unlock(password, remember) {
  $("openBtn").disabled = true; $("err").textContent = "Abriendo…";
  try {
    DATA = await decrypt(password);
    if (remember) safeSet(STORE + ":pw", password);
    $("lock").classList.add("hidden"); $("app").classList.remove("hidden");
    start();
  } catch {
    $("err").textContent = "Contraseña incorrecta.";
    safeDel(STORE + ":pw");
  } finally { $("openBtn").disabled = false; }
}

$("lockForm").addEventListener("submit", (e) => { e.preventDefault(); unlock($("pw").value, $("remember").checked); });
$("logout").addEventListener("click", () => { safeDel(STORE + ":pw"); location.reload(); });
const saved = safeGet(STORE + ":pw");
if (saved) unlock(saved, true);

function statusOf(id) { return safeGet(STORE + ":st:" + id) || ""; }
function norm(s) { return (s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase(); }
function waLink(phone) { return "https://wa.me/" + phone.replace(/\D/g, ""); }

function start() {
  $("updated").textContent = "Actualizado " + DATA.actualizado + " · desde " + DATA.foco;
  const items = DATA.duenos;
  $("sTotal").textContent = items.length;
  $("sNear").textContent = items.filter((d) => d.km !== null && d.km < 5).length;
  $("sPhone").textContent = items.filter((d) => d.telefonos.length).length;
  const counts = {};
  items.forEach((d) => { const k = d.distrito || "Sin distrito"; counts[k] = (counts[k] || 0) + 1; });
  const order = Object.keys(counts).sort((a, b) => {
    const ka = Math.min(...items.filter((d) => (d.distrito || "Sin distrito") === a).map((d) => d.km ?? 99));
    const kb = Math.min(...items.filter((d) => (d.distrito || "Sin distrito") === b).map((d) => d.km ?? 99));
    return ka - kb;
  });
  const chips = [["Todos", items.length], ["☎ Con teléfono", null], ["Sin corredores", null], ["Pendientes", null], ["Interesados", null], ...order.map((k) => [k, counts[k]])];
  $("chips").innerHTML = "";
  chips.forEach(([label, n]) => {
    const b = document.createElement("button");
    b.className = "chip"; b.type = "button";
    b.textContent = n === null ? label : `${label} · ${n}`;
    b.dataset.value = label;
    b.addEventListener("click", () => {
      if (["☎ Con teléfono", "Sin corredores", "Pendientes", "Interesados"].includes(label)) state.only = state.only === label ? "" : label;
      else state.district = label;
      render();
    });
    $("chips").appendChild(b);
  });
  $("q").addEventListener("input", (e) => { state.q = norm(e.target.value); render(); });
  $("sort").addEventListener("change", (e) => { state.sort = e.target.value; render(); });
  render();
}

function render() {
  document.querySelectorAll(".chip").forEach((b) => {
    const v = b.dataset.value;
    b.setAttribute("aria-pressed", String(v === state.district || v === state.only));
  });
  let items = DATA.duenos.filter((d) => {
    if (state.district !== "Todos" && (d.distrito || "Sin distrito") !== state.district) return false;
    if (state.only === "☎ Con teléfono" && !d.telefonos.length) return false;
    if (state.only === "Sin corredores" && !d.no_corredores) return false;
    if (state.only === "Pendientes" && statusOf(d.id)) return false;
    if (state.only === "Interesados" && statusOf(d.id) !== "interesado") return false;
    if (state.q && !norm([d.distrito, d.titulo, d.precio, d.texto, d.por_que].join(" ")).includes(state.q)) return false;
    return true;
  });
  const by = { km: (a, b) => (a.km ?? 99) - (b.km ?? 99) || b.confianza - a.confianza,
               conf: (a, b) => b.confianza - a.confianza || (a.km ?? 99) - (b.km ?? 99),
               new: (a, b) => (b.revisado || "").localeCompare(a.revisado || "") || b.id - a.id };
  items.sort(by[state.sort]);
  const list = $("list");
  list.innerHTML = "";
  if (!items.length) { list.innerHTML = '<div class="empty">No hay dueños con ese filtro.</div>'; return; }
  items.forEach((d) => list.appendChild(card(d)));
}

function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; }

function card(d) {
  const c = el("article", "card"); c.dataset.status = statusOf(d.id);
  const top = el("div", "card-top");
  const left = el("div");
  const place = el("div", "place", d.distrito || "Distrito por confirmar");
  if (d.km !== null) place.appendChild(el("span", "km", ` · ${d.km.toFixed(1)} km${d.aprox ? " aprox." : ""}`));
  left.appendChild(place);
  const conf = el("div", "conf", `Dueño ${d.confianza}%`);
  const bar = el("div", "bar"); const fill = el("i"); fill.style.width = d.confianza + "%"; bar.appendChild(fill); conf.appendChild(bar);
  top.append(left, conf);
  c.appendChild(top);
  c.appendChild(el("div", "title", d.titulo));
  const meta = el("div", "meta");
  if (d.precio) meta.appendChild(el("span", "tag", /^(S\/[12]|Gratis)$/i.test(d.precio) ? d.precio + " (simbólico)" : d.precio));
  if (d.no_corredores) meta.appendChild(el("span", "tag warn", "No quiere corredores"));
  if (d.telefonos.length) meta.appendChild(el("span", "tag ok", "☎ " + d.telefonos.map((p) => p.replace("+51", "")).join(", ")));
  if (d.repeticiones) meta.appendChild(el("span", "tag", `publicado ${d.repeticiones + 1} veces`));
  meta.appendChild(el("span", "tag", "#" + d.id));
  c.appendChild(meta);
  const det = el("details");
  det.appendChild(el("summary", "", "Por qué es dueño y cómo abrir la llamada"));
  const why = el("div", "why");
  why.appendChild(el("b", "", "Por qué es dueño")); why.appendChild(el("div", "", d.por_que));
  why.appendChild(el("b", "", "Cómo abrir")); why.appendChild(el("div", "", d.como_abrir || "—"));
  why.appendChild(el("div", "full", d.texto));
  det.appendChild(why); c.appendChild(det);
  const actions = el("div", "actions");
  if (d.telefonos.length) {
    const call = el("a", "btn act call", "Llamar"); call.href = "tel:" + d.telefonos[0]; actions.appendChild(call);
    const wa = el("a", "btn act", "WhatsApp"); wa.href = waLink(d.telefonos[0]); wa.target = "_blank"; wa.rel = "noopener"; actions.appendChild(wa);
  }
  if (d.url) { const fb = el("a", "btn act", d.telefonos.length ? "Anuncio" : "Ver anuncio / Messenger"); fb.href = d.url; fb.target = "_blank"; fb.rel = "noopener"; actions.appendChild(fb); }
  const st = el("label", "status");
  const sel = el("select"); sel.setAttribute("aria-label", "Estado");
  [["", "Sin llamar"], ["llamado", "Llamado"], ["no_contesta", "No contesta"], ["interesado", "Interesado"], ["descartado", "Descartado"]]
    .forEach(([v, t]) => { const o = el("option", "", t); o.value = v; sel.appendChild(o); });
  sel.value = statusOf(d.id);
  sel.addEventListener("change", () => { if (sel.value) safeSet(STORE + ":st:" + d.id, sel.value); else safeDel(STORE + ":st:" + d.id); c.dataset.status = sel.value; });
  st.appendChild(sel); actions.appendChild(st);
  c.appendChild(actions);
  return c;
}
