<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#003DA5">
<title>Dueños RE/MAX</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f5f9;--surface:#ffffff;--surface-2:#f6f7fa;--sunken:#eceff4;--text:#0f172a;--text-2:#334155;--muted:#64748b;--line:#e3e7ee;
  --red:#dc1c2e;--red-ink:#ffffff;--red-soft:#fdecee;--blue:#003da5;--blue-soft:#e8eefb;--blue-ink:#ffffff;
  --hi:#0e8a4f;--hi-soft:#e3f5ec;--mid:#b26a00;--mid-soft:#fff4e0;--lo:#64748b;--lo-soft:#eef1f5;
  --warn:#9a4a00;--warn-soft:#ffefd9;--focus:#2f6bff;
  --shadow:0 1px 2px rgba(15,23,42,.05),0 4px 14px rgba(15,23,42,.06);--shadow-lg:0 10px 30px rgba(15,23,42,.12);
  --radius:16px;color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b0f17;--surface:#131926;--surface-2:#182031;--sunken:#0f1520;--text:#e8edf6;--text-2:#c4cede;--muted:#8d9ab0;--line:#232c3d;
  --red:#ff4d5e;--red-ink:#ffffff;--red-soft:#3a1519;--blue:#6f9cff;--blue-soft:#17233d;--blue-ink:#0b0f17;
  --hi:#45d690;--hi-soft:#10301f;--mid:#f2b04a;--mid-soft:#33260f;--lo:#8d9ab0;--lo-soft:#1c2433;
  --warn:#f5b45a;--warn-soft:#33240f;--focus:#7aa2ff;--shadow:none;--shadow-lg:0 10px 30px rgba(0,0,0,.5);color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0b0f17;--surface:#131926;--surface-2:#182031;--sunken:#0f1520;--text:#e8edf6;--text-2:#c4cede;--muted:#8d9ab0;--line:#232c3d;
  --red:#ff4d5e;--red-ink:#ffffff;--red-soft:#3a1519;--blue:#6f9cff;--blue-soft:#17233d;--blue-ink:#0b0f17;
  --hi:#45d690;--hi-soft:#10301f;--mid:#f2b04a;--mid-soft:#33260f;--lo:#8d9ab0;--lo-soft:#1c2433;
  --warn:#f5b45a;--warn-soft:#33240f;--focus:#7aa2ff;--shadow:none;--shadow-lg:0 10px 30px rgba(0,0,0,.5);color-scheme:dark;}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.5 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.hidden{display:none!important}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}

/* ---------- Candado ---------- */
.lock{min-height:100vh;display:grid;place-items:center;padding:16px;background:
  radial-gradient(1200px 500px at 10% -10%,var(--blue-soft),transparent 60%),radial-gradient(900px 400px at 110% 110%,var(--red-soft),transparent 60%),var(--bg)}
.lock-card{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:28px;box-shadow:var(--shadow-lg)}
.brand{display:inline-flex;align-items:center;gap:8px;font-weight:800;letter-spacing:.3px}
.brand-mark{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--red),#a3101e);color:#fff;font-size:12px}
.lock h1{font-size:22px;line-height:1.2;margin:18px 0 6px}
.lock p{color:var(--muted);margin:0 0 18px}
.field{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);transition:border-color .15s}
.field:focus{border-color:var(--focus);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--focus) 25%,transparent)}
.check{display:flex;gap:8px;align-items:center;margin:14px 0;color:var(--text-2);font-size:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;border-radius:12px;padding:11px 16px;font-weight:600;cursor:pointer;text-decoration:none;white-space:nowrap;transition:transform .05s,background .15s,border-color .15s}
.btn:active{transform:translateY(1px)}
.btn svg{width:18px;height:18px;flex:0 0 auto}
.btn-red{background:var(--red);color:var(--red-ink)}
.btn-red:hover{filter:brightness(1.05)}
.btn-blue{background:var(--blue);color:var(--blue-ink)}
.btn-ghost{background:var(--surface);border-color:var(--line);color:var(--text)}
.btn-ghost:hover{background:var(--surface-2)}
.btn-block{width:100%}
.err{color:var(--red);font-size:14px;min-height:20px;margin-top:10px}

/* ---------- Barra superior ---------- */
.topbar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line)}
.topbar-in{display:flex;align-items:center;justify-content:space-between;gap:12px;height:60px}
.topbar .sub{color:var(--muted);font-size:12px;font-weight:500}
.tb-title{display:flex;flex-direction:column;line-height:1.2}
.tb-title b{font-size:16px}

/* ---------- KPIs ---------- */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:18px 0 14px}
.kpi{all:unset;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:2px;transition:border-color .15s,transform .05s}
.kpi:hover{border-color:color-mix(in srgb,var(--blue) 40%,var(--line))}
.kpi:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.kpi[aria-pressed="true"]{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-soft)}
.kpi b{font-size:24px;font-weight:800;letter-spacing:-.5px}
.kpi span{color:var(--muted);font-size:12px;font-weight:500}
.kpi.k-hi b{color:var(--hi)}
.kpi.k-red b{color:var(--red)}

/* ---------- Herramientas ---------- */
.tools{position:sticky;top:60px;z-index:15;background:var(--bg);padding:8px 0 10px}
.toolrow{display:flex;gap:8px}
.search{position:relative;flex:1}
.search svg{position:absolute;left:12px;top:50%;width:18px;height:18px;transform:translateY(-50%);color:var(--muted)}
.search .field{padding-left:38px;background:var(--surface)}
.sort{flex:0 0 auto;width:auto;background:var(--surface);padding-right:30px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none;mask-image:linear-gradient(90deg,#000 92%,transparent)}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap;color:var(--text-2)}
.chip small{color:var(--muted);font-weight:600;margin-left:4px}
.chip[aria-pressed="true"]{background:var(--text);border-color:var(--text);color:var(--bg)}
.chip[aria-pressed="true"] small{color:inherit;opacity:.7}
.resultbar{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:13px;margin:6px 0 10px}
.linkbtn{all:unset;cursor:pointer;color:var(--blue);font-weight:600}

/* ---------- Tarjetas ---------- */
.list{display:grid;grid-template-columns:1fr;gap:12px;padding-bottom:40px}
@media (min-width:980px){.list{grid-template-columns:1fr 1fr}}
.card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 16px 14px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px;overflow:hidden}
.card::before{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:var(--accent,var(--lo))}
.card[data-level="hi"]{--accent:var(--hi)}
.card[data-level="mid"]{--accent:var(--mid)}
.card[data-status="descartado"]{opacity:.5}
.card[data-status="interesado"]{border-color:var(--hi)}
.c-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.loc{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-weight:700;font-size:15px}
.km{font-weight:600;font-size:12px;padding:2px 8px;border-radius:999px;background:var(--blue-soft);color:var(--blue)}
.km.far{background:var(--lo-soft);color:var(--lo)}
.km.unk{background:var(--warn-soft);color:var(--warn)}
.score{flex:0 0 auto;display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--lo-soft);color:var(--lo)}
.score.hi{background:var(--hi-soft);color:var(--hi)}
.score.mid{background:var(--mid-soft);color:var(--mid)}
.top{font-size:11px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;color:var(--red-ink);background:var(--red);padding:3px 8px;border-radius:6px}
.title{font-size:16px;font-weight:600;line-height:1.35;margin:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.facts{display:flex;flex-wrap:wrap;gap:6px 14px;color:var(--text-2);font-size:13px;font-weight:500}
.facts span{display:inline-flex;align-items:center;gap:5px}
.facts svg{width:15px;height:15px;color:var(--muted)}
.price{font-weight:800;color:var(--text);font-size:15px}
.price.sym{font-weight:600;color:var(--muted);font-size:13px}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:12px;font-weight:600;border-radius:8px;padding:3px 8px;background:var(--sunken);color:var(--muted)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.ok{background:var(--hi-soft);color:var(--hi)}
.tip{background:var(--blue-soft);border-radius:12px;padding:10px 12px;font-size:14px;color:var(--text-2)}
.tip b{display:block;font-size:11px;letter-spacing:.4px;text-transform:uppercase;color:var(--blue);margin-bottom:2px}
details.more summary{cursor:pointer;color:var(--blue);font-size:13px;font-weight:600;list-style:none}
details.more summary::-webkit-details-marker{display:none}
details.more summary::before{content:"＋ "}
details.more[open] summary::before{content:"－ "}
.more-body{margin-top:8px;font-size:14px;color:var(--text-2);display:grid;gap:8px}
.more-body b{font-size:11px;letter-spacing:.4px;text-transform:uppercase;color:var(--muted)}
.full{font-size:13px;color:var(--muted);overflow-wrap:anywhere;max-height:180px;overflow:auto;background:var(--surface-2);border-radius:10px;padding:10px}
.actions{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:2px}
.actions.two{grid-template-columns:1fr 1fr auto}
.icon{all:unset;display:grid;place-items:center;width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);cursor:pointer;color:var(--text-2)}
.icon:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.icon svg{width:18px;height:18px}
.status{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--sunken);padding:4px;border-radius:12px}
.status button{all:unset;cursor:pointer;text-align:center;font-size:12px;font-weight:600;padding:7px 4px;border-radius:9px;color:var(--muted)}
.status button:focus-visible{outline:2px solid var(--focus)}
.status button[aria-pressed="true"]{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
.status button[data-v="interesado"][aria-pressed="true"]{color:var(--hi)}
.status button[data-v="descartado"][aria-pressed="true"]{color:var(--red)}
.note{width:100%;min-height:38px;resize:vertical;border:1px dashed var(--line);background:transparent;border-radius:10px;padding:8px 10px;font-size:13px}
.note:focus{border-style:solid;border-color:var(--focus);outline:none}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:56px 16px;background:var(--surface);border:1px dashed var(--line);border-radius:var(--radius)}
.foot{color:var(--muted);font-size:12px;text-align:center;padding:8px 0 32px}
.totop{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));width:46px;height:46px;border-radius:50%;border:0;background:var(--blue);color:var(--blue-ink);box-shadow:var(--shadow-lg);cursor:pointer;display:grid;place-items:center;opacity:0;pointer-events:none;transition:opacity .2s}
.totop.show{opacity:1;pointer-events:auto}
.totop svg{width:20px;height:20px}
@media (max-width:640px){
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpi b{font-size:22px}
  .tb-title .sub{display:none}
  .actions.two{grid-template-columns:1fr 1fr}
  .actions.two .icon{grid-column:1/-1;width:auto}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-phone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></symbol>
  <symbol id="i-chat" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.4 8.4 0 0 1-12.4 7.4L3 21l2.1-5.6A8.5 8.5 0 1 1 21 11.5z"/></symbol>
  <symbol id="i-ext" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6M15 3h6v6M10 14 21 3"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></symbol>
  <symbol id="i-home" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V21H3z"/></symbol>
  <symbol id="i-area" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></symbol>
  <symbol id="i-bed" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 18V7M3 13h18v5M21 13a3 3 0 0 0-3-3h-7v3"/><circle cx="7" cy="10.5" r="1.5"/></symbol>
  <symbol id="i-up" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m6 15 6-6 6 6"/></symbol>
  <symbol id="i-copy" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/></symbol>
</svg>

<section id="lock" class="lock">
  <form class="lock-card" id="lockForm" autocomplete="off">
    <span class="brand"><span class="brand-mark">R/M</span> RE/MAX Exclusive</span>
    <h1>Dueños para llamar</h1>
    <p>Lista privada de propietarios que venden directo. Escribe tu contraseña.</p>
    <input class="field" id="pw" type="password" placeholder="Contraseña" autocomplete="current-password" required aria-label="Contraseña">
    <label class="check"><input type="checkbox" id="remember" checked> Recordar en este dispositivo</label>
    <button class="btn btn-red btn-block" type="submit" id="openBtn">Abrir lista</button>
    <div class="err" id="err" role="alert"></div>
  </form>
</section>

<div id="app" class="hidden">
  <div class="topbar">
    <div class="wrap topbar-in">
      <span class="brand"><span class="brand-mark">R/M</span><span class="tb-title"><b>Dueños para llamar</b><span class="sub" id="updated"></span></span></span>
      <button class="btn btn-ghost" id="logout" title="Olvidar la contraseña en este dispositivo">Salir</button>
    </div>
  </div>

  <main class="wrap">
    <div class="kpis" role="group" aria-label="Resumen">
      <button class="kpi" data-only="" type="button"><b id="kTotal">0</b><span>dueños en total</span></button>
      <button class="kpi k-hi" data-only="hi" type="button"><b id="kHi">0</b><span>muy probables (80%+)</span></button>
      <button class="kpi" data-only="near" type="button"><b id="kNear">0</b><span>a menos de 5 km</span></button>
      <button class="kpi k-red" data-only="todo" type="button"><b id="kTodo">0</b><span>sin llamar aún</span></button>
    </div>

    <div class="tools">
      <div class="toolrow">
        <label class="search"><svg><use href="#i-search"/></svg><input class="field" id="q" type="search" placeholder="Buscar distrito, calle, precio…" aria-label="Buscar"></label>
        <select class="field sort" id="sort" aria-label="Ordenar">
          <option value="prio">Prioridad</option>
          <option value="km">Más cerca</option>
          <option value="conf">Más seguro</option>
          <option value="new">Más reciente</option>
        </select>
      </div>
      <div class="chips" id="chips" role="group" aria-label="Filtros"></div>
    </div>

    <div class="resultbar"><span id="count"></span><button class="linkbtn hidden" id="clear" type="button">Quitar filtros</button></div>
    <div class="list" id="list"></div>
    <div class="foot">Anuncios públicos de Facebook revisados uno por uno · Uso interno, no compartir</div>
  </main>
  <button class="totop" id="totop" aria-label="Volver arriba"><svg><use href="#i-up"/></svg></button>

const STORE = "remax-dueños";
const $ = (id) => document.getElementById(id);
let DATA = null;
const state = { q: "", district: "", only: "", type: "", sort: "prio" };

function safeGet(k) { try { return localStorage.getItem(k); } catch { return null; } }
function safeSet(k, v) { try { localStorage.setItem(k, v); } catch {} }
function safeDel(k) { try { localStorage.removeItem(k); } catch {} }
const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
const norm = (s) => (s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();

async function decrypt(password) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(PAYLOAD.salt), iterations: PAYLOAD.iterations, hash: "SHA-256" },
    base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(PAYLOAD.iv) }, key, b64(PAYLOAD.data));
  return JSON.parse(new TextDecoder().decode(plain));
}

async function unlock(password, remember) {
  $("openBtn").disabled = true; $("err").textContent = "Abriendo…";
  try {
    DATA = await decrypt(password);
    if (remember) safeSet(STORE + ":pw", password);
    $("lock").classList.add("hidden"); $("app").classList.remove("hidden");
    start();
  } catch {
    $("err").textContent = "Contraseña incorrecta. Revísala e intenta otra vez.";
    safeDel(STORE + ":pw");
  } finally { $("openBtn").disabled = false; }
}
$("lockForm").addEventListener("submit", (e) => { e.preventDefault(); unlock($("pw").value.trim(), $("remember").checked); });
$("logout").addEventListener("click", () => { safeDel(STORE + ":pw"); location.reload(); });
const saved = safeGet(STORE + ":pw");
if (saved) unlock(saved, true);

const statusOf = (id) => safeGet(STORE + ":st:" + id) || "";
const noteOf = (id) => safeGet(STORE + ":note:" + id) || "";
const level = (c) => (c >= 80 ? "hi" : c >= 70 ? "mid" : "lo");
// "S/1", "S/240", "Gratis": Facebook muestra un precio simbólico o recortado.
const symbolic = (p) => !p || /^gratis$/i.test(p.trim()) || /^(S\/|US\$|\$)\s?\d{1,3}$/.test(p.trim());
function priority(d) {
  let p = d.confianza;
  if (d.km !== null && !d.aprox) p += d.km <= 3 ? 22 : d.km <= 6 ? 14 : d.km <= 12 ? 5 : 0;
  if (d.aprox || d.km === null) p -= 12;
  if (d.telefonos.length) p += 8;
  return p;
}
function kmSort(d) { return d.km === null ? 999 : d.aprox ? 500 + d.km : d.km; }

function start() {
  const items = DATA.duenos;
  items.forEach((d) => { d.prio = priority(d); });
  $("updated").textContent = "Actualizado " + DATA.actualizado;
  const counts = {};
  items.forEach((d) => { if (d.distrito && !d.aprox) counts[d.distrito] = (counts[d.distrito] || 0) + 1; });
  const districts = Object.keys(counts).sort((a, b) =>
    Math.min(...items.filter((d) => d.distrito === a).map(kmSort)) - Math.min(...items.filter((d) => d.distrito === b).map(kmSort)));
  const types = ["Departamento", "Casa", "Terreno", "Local"].filter((t) => items.some((d) => d.tipo === t));
  const chips = [
    { label: "Todos", kind: "reset" },
    { label: "☎ Con teléfono", kind: "only", value: "phone", n: items.filter((d) => d.telefonos.length).length },
    { label: "Sin corredores", kind: "only", value: "noagents", n: items.filter((d) => d.no_corredores).length },
    { label: "Interesados", kind: "only", value: "interested" },
    ...types.map((t) => ({ label: t, kind: "type", value: t, n: items.filter((d) => d.tipo === t).length })),
    ...districts.map((k) => ({ label: k, kind: "district", value: k, n: counts[k] })),
  ];
  const box = $("chips"); box.innerHTML = "";
  chips.forEach((c) => {
    const b = document.createElement("button");
    b.type = "button"; b.className = "chip"; b.dataset.kind = c.kind; b.dataset.value = c.value || "";
    b.textContent = c.label;
    if (c.n !== undefined) { const s = document.createElement("small"); s.textContent = c.n; b.appendChild(s); }
    b.addEventListener("click", () => {
      if (c.kind === "reset") Object.assign(state, { district: "", only: "", type: "", q: "" }), ($("q").value = "");
      else if (c.kind === "district") state.district = state.district === c.value ? "" : c.value;
      else if (c.kind === "type") state.type = state.type === c.value ? "" : c.value;
      else state.only = state.only === c.value ? "" : c.value;
      render();
    });
    box.appendChild(b);
  });
  document.querySelectorAll(".kpi").forEach((k) => k.addEventListener("click", () => {
    state.only = state.only === k.dataset.only ? "" : k.dataset.only; render();
  }));
  $("q").addEventListener("input", (e) => { state.q = norm(e.target.value.trim()); render(); });
  $("sort").addEventListener("change", (e) => { state.sort = e.target.value; render(); });
  $("clear").addEventListener("click", () => { Object.assign(state, { district: "", only: "", type: "", q: "" }); $("q").value = ""; render(); });
  window.addEventListener("scroll", () => $("totop").classList.toggle("show", scrollY > 600), { passive: true });
  $("totop").addEventListener("click", () => scrollTo({ top: 0, behavior: "smooth" }));
  render();
}

function kpis() {
  const items = DATA.duenos;
  $("kTotal").textContent = items.length;
  $("kHi").textContent = items.filter((d) => d.confianza >= 80).length;
  $("kNear").textContent = items.filter((d) => d.km !== null && !d.aprox && d.km < 5).length;
  $("kTodo").textContent = items.filter((d) => !statusOf(d.id)).length;
  document.querySelectorAll(".kpi").forEach((k) => k.setAttribute("aria-pressed", String(k.dataset.only === state.only && state.only !== "")));
}

function matches(d) {
  if (state.district && (d.distrito !== state.district || d.aprox)) return false;
  if (state.type && d.tipo !== state.type) return false;
  const st = statusOf(d.id);
  switch (state.only) {
    case "hi": if (d.confianza < 80) return false; break;
    case "near": if (d.km === null || d.aprox || d.km >= 5) return false; break;
    case "todo": if (st) return false; break;
    case "phone": if (!d.telefonos.length) return false; break;
    case "noagents": if (!d.no_corredores) return false; break;
    case "interested": if (st !== "interesado") return false; break;
  }
  if (state.q && !norm([d.distrito, d.tipo, d.titulo, d.precio, d.texto, d.por_que].join(" ")).includes(state.q)) return false;
  return true;
}

function render() {
  kpis();
  document.querySelectorAll(".chip").forEach((b) => {
    const { kind, value } = b.dataset;
    const on = kind === "reset" ? !state.district && !state.only && !state.type && !state.q
      : kind === "district" ? state.district === value : kind === "type" ? state.type === value : state.only === value;
    b.setAttribute("aria-pressed", String(on));
  });
  const sorters = {
    prio: (a, b) => b.prio - a.prio || kmSort(a) - kmSort(b),
    km: (a, b) => kmSort(a) - kmSort(b) || b.confianza - a.confianza,
    conf: (a, b) => b.confianza - a.confianza || kmSort(a) - kmSort(b),
    new: (a, b) => (b.revisado || "").localeCompare(a.revisado || "") || b.id - a.id,
  };
  const items = DATA.duenos.filter(matches).sort(sorters[state.sort]);
  const filtered = state.district || state.only || state.type || state.q;
  $("count").textContent = items.length === 1 ? "1 dueño" : `${items.length} dueños`;
  $("clear").classList.toggle("hidden", !filtered);
  const list = $("list"); list.innerHTML = "";
  if (!items.length) { const e = el("div", "empty", "No hay dueños con estos filtros."); list.appendChild(e); return; }
  const frag = document.createDocumentFragment();
  items.forEach((d, i) => frag.appendChild(card(d, state.sort === "prio" && !filtered && i < 3)));
  list.appendChild(frag);
}

function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; }
function icon(name) { const s = document.createElementNS("http://www.w3.org/2000/svg", "svg"); const u = document.createElementNS("http://www.w3.org/2000/svg", "use"); u.setAttribute("href", "#i-" + name); s.appendChild(u); return s; }
function btn(cls, iconName, label, href) {
  const a = el("a", "btn " + cls); a.appendChild(icon(iconName)); a.appendChild(document.createTextNode(label));
  a.href = href; if (/^https?:/.test(href)) { a.target = "_blank"; a.rel = "noopener"; }
  return a;
}

function card(d, isTop) {
  const lv = level(d.confianza);
  const c = el("article", "card"); c.dataset.level = lv; c.dataset.status = statusOf(d.id);
  const head = el("div", "c-head");

  if (isTop) loc.appendChild(el("span", "top", "Llamar primero"));
  loc.appendChild(el("span", "", d.aprox || !d.distrito ? "Ubicación por confirmar" : d.distrito));
  if (d.aprox || d.km === null) loc.appendChild(el("span", "km unk", d.distrito ? `publicado en ${d.distrito}` : "sin distrito"));
  else loc.appendChild(el("span", "km" + (d.km > 8 ? " far" : ""), `${d.km.toFixed(1)} km`));
  const sc = el("span", "score " + lv, `${lv === "hi" ? "Muy probable" : lv === "mid" ? "Probable" : "Posible"} · ${d.confianza}%`);

  const facts = el("div", "facts");

  facts.appendChild(pr);
  if (d.tipo) { const s = el("span"); s.append(icon("home"), d.tipo); facts.appendChild(s); }
  if (d.m2) { const s = el("span"); s.append(icon("area"), `${d.m2} m²`); facts.appendChild(s); }
  if (d.dorm) { const s = el("span"); s.append(icon("bed"), `${d.dorm} dorm.`); facts.appendChild(s); }
  c.appendChild(facts);

  const tags = el("div", "tags");
  if (d.no_corredores) tags.appendChild(el("span", "tag warn", "No quiere corredores"));
  if (d.telefonos.length) tags.appendChild(el("span", "tag ok", "☎ " + d.telefonos.map((p) => p.replace("+51", "")).join(" · ")));
  if (d.repeticiones) tags.appendChild(el("span", "tag", `Publicado ${d.repeticiones + 1} veces`));
  if (tags.childNodes.length) c.appendChild(tags);

  if (d.como_abrir) { const tip = el("div", "tip"); tip.appendChild(el("b", "", "Cómo abrir la llamada")); tip.appendChild(document.createTextNode(d.como_abrir)); c.appendChild(tip); }

  const more = el("details", "more"); more.appendChild(el("summary", "", "Por qué es dueño y anuncio completo"));
  const body = el("div", "more-body");
  const w = el("div"); w.appendChild(el("b", "", "Por qué es dueño")); w.appendChild(el("div", "", d.por_que)); body.appendChild(w);
  body.appendChild(el("div", "full", d.texto));
  body.appendChild(el("div", "", `Ficha #${d.id} · revisado ${d.revisado}`));
  more.appendChild(body); c.appendChild(more);

  const actions = el("div", "actions" + (d.telefonos.length ? " two" : ""));
  if (d.telefonos.length) {
    actions.appendChild(btn("btn-red", "phone", "Llamar", "tel:" + d.telefonos[0]));
    actions.appendChild(btn("btn-ghost", "chat", "WhatsApp", "https://wa.me/" + d.telefonos[0].replace(/\D/g, "")));
  } else if (d.url) {
    actions.appendChild(btn("btn-red", "chat", "Escribir por Messenger", d.url));
  }
  if (d.url) {
    const open = el("button", "icon"); open.type = "button"; open.title = "Abrir anuncio en Facebook"; open.setAttribute("aria-label", "Abrir anuncio en Facebook");
    open.appendChild(icon("ext")); open.addEventListener("click", () => window.open(d.url, "_blank", "noopener"));
    actions.appendChild(open);
  }
  c.appendChild(actions);

  const st = el("div", "status"); st.setAttribute("role", "group"); st.setAttribute("aria-label", "Estado de la llamada");
  [["llamado", "Llamé"], ["no_contesta", "No contesta"], ["interesado", "Interesado"], ["descartado", "Descartar"]].forEach(([v, t]) => {
    const b = el("button", "", t); b.type = "button"; b.dataset.v = v; b.setAttribute("aria-pressed", String(statusOf(d.id) === v));
    b.addEventListener("click", () => {
      const next = statusOf(d.id) === v ? "" : v;
      if (next) safeSet(STORE + ":st:" + d.id, next); else safeDel(STORE + ":st:" + d.id);
      c.dataset.status = next;
      st.querySelectorAll("button").forEach((x) => x.setAttribute("aria-pressed", String(x.dataset.v === next)));
      kpis();
    });
    st.appendChild(b);
  });
  c.appendChild(st);

  const note = el("textarea", "note"); note.rows = 1; note.placeholder = "Notas de la llamada (solo en este dispositivo)…"; note.value = noteOf(d.id);
  note.setAttribute("aria-label", "Notas");
  note.addEventListener("change", () => { const v = note.value.trim(); if (v) safeSet(STORE + ":note:" + d.id, v); else safeDel(STORE + ":note:" + d.id); });
  c.appendChild(note);
  return c;
}
</script>
</body>
</html>
